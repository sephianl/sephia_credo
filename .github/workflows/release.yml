name: Release

on:
  push:
    branches: [main]
    paths:
      - "mix.exs"

permissions:
  contents: write

jobs:
  release:
    runs-on: self-hosted
    env:
      DEVENV_NO_GIT_HOOKS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags are what the guard below reads; the default depth fetches none.
          fetch-depth: 0

      - name: Get version
        id: version
        run: |
          version=$(grep '@version "' mix.exs | sed 's/.*"\(.*\)".*/\1/')
          echo "version=v${version}" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: check_tag
        run: |
          if git rev-parse "${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Get dependencies
        if: steps.check_tag.outputs.exists == 'false'
        run: devenv shell mix deps.get

      # A tag is what the Hex publish is cut from, so the tree is verified here
      # rather than trusting that ci.yml passed on the same commit.
      - name: Verify
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          devenv shell mix compile --warnings-as-errors
          devenv shell mix format --check-formatted
          devenv shell mix test

      # Tag and GitHub release only. Publishing to Hex is done by hand from a
      # machine that is already authenticated, so no API key lives in CI.
      - name: Create release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
