name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A push that lands while the previous one is still running makes that run
# stale, so it is cancelled rather than raced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Kept in step with devenv.nix, which pins elixir_1_20 on OTP 29.
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20"
          otp-version: "29"

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-1.20-29-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-1.20-29-

      - name: Get dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Check formatting
        run: mix format --check-formatted

      # `--strict` is what the pre-commit hook runs through `.check.exs`, so a
      # commit that passes locally is the one CI passes too.
      - name: Run Credo
        run: mix credo --strict

      - name: Run tests
        run: mix test

  # mix.exs promises `elixir: "~> 1.19"` while development runs the newest
  # Elixir, so a function added after 1.19 compiles everywhere `check` looks.
  # Compiling and testing on the oldest supported pair, 1.19 on the oldest OTP
  # it runs on, is what keeps the promise. Formatting and Credo stay with
  # `check`: they judge the source, not the Elixir it runs on.
  minimum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19"
          otp-version: "26"

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-1.19-26-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-1.19-26-

      - name: Get dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile

      - name: Run tests
        run: mix test
